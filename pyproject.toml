[project]
name = "vllm-server"
version = "0.1.0"
description = "vLLM OpenAI-compatible server for Qwen/Qwen3.8-27B on NVIDIA GB10 (Blackwell)"
requires-python = ">=3.12"
dependencies = [
    "vllm>=0.9.0",
    # Qwen3.6 and Qwen3.8 both use model_type 'qwen3_5', so pin a recent transformers.
    "transformers>=4.57.1",
    # HF hub 1.x downloads via hf-xet (fast by default); no hf-transfer extra.
    "huggingface-hub>=1.0",
]
