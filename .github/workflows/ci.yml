# CI — on every PR and every push to main, on GitHub's own runner: lint + functional checks that need no image and
# no GPU. Nothing here runs on the GPU server, so a PR from a fork can never touch it.
# The image build, Anchore scan and GPU tests are CD's job (cd.yml): they gate the image that actually gets deployed.
name: CI
on:
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Lint — Python (ruff)
        run: pipx run ruff==0.8.6 check .
      - name: Lint — shell (shellcheck, warnings and errors)
        run: docker run --rm -v "$PWD:/m:ro" -w /m koalaman/shellcheck:v0.10.0 -S warning serve.sh watchdog.sh ci/*.sh ci/fake/*
      - name: Lint — Dockerfiles (hadolint, errors only)
        run: for f in Dockerfile Dockerfile.qwen3.6; do docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < "$f" || exit 1; done
      - name: Functional checks (compose, Prometheus, dashboards, watchdog)
        run: sh ci/offline_checks.sh
