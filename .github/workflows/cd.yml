# CD — after CI passes on a push to main: wait until nothing is using vLLM, swap the live container to the tested
# commit, test it on the real GPU, and roll back to the previous image if the test fails. One GPU, so this is a swap
# (a few minutes of downtime), not a side-by-side test.
name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: [self-hosted, vllm]
    timeout-minutes: 480          # waits for an AMC tuning run to finish first, which can take hours
    env:
      LIVE_DIR: /home/sysadmin/vllm-for-dgx-spark   # the live stack runs from this checkout (bind mounts, project name)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Swap, test on the GPU, roll back on failure
        run: sh ci/deploy.sh "${{ github.event.workflow_run.head_sha }}"
