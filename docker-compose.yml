# Qwen3.8-27B (NVFP4) — the live stack. The previous generation is kept, byte for
# byte, in docker-compose.qwen3.6.yml + Dockerfile.qwen3.6; only one of the two can
# run at a time (each needs ~24GB of the 5090's 32GB VRAM, and both bind port 8000).
#
#   docker compose down -v --remove-orphans   # or: docker compose -f docker-compose.qwen3.6.yml down
#   docker compose up -d --build
#
# FIRST BOOT ONLY: this checkpoint ships an FP8-quantized lm_head that vLLM 0.22.1
# cannot load. Run patch_lmhead_bf16.py against the HF cache once, before starting.
services:
  vllm:
    build: .
    image: vllm-qwen38-nvfp4:latest
    container_name: vllm-qwen38
    # Auto-start on boot + restart on crash. Safe now: nouveau is permanently
    # blacklisted and mem_limit prevents a host OOM, so it can't crash-loop the box.
    restart: always

    # GPU passthrough — equivalent to `docker run --gpus all`.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # HARD host-memory safety net. This box has 62GB RAM (NOT the GB10's 121GB
    # unified). Without a cap, a vLLM memory spike triggers the *host* OOM-killer
    # and locks up the machine. Capping makes the container OOM itself (exit 137)
    # instead — the host stays alive. memswap_limit == mem_limit disables swap
    # spill so it fails fast and cleanly. Leaves ~10GB for the OS/desktop.
    mem_limit: 52g
    memswap_limit: 52g

    # vLLM uses large shared-memory segments between its worker processes.
    ipc: host

    ports:
      - "${HOST_PORT:-8000}:8000"

    environment:
      MODEL: unsloth/Qwen3.8-27B-NVFP4
      # PINNED — this is the snapshot patch_lmhead_bf16.py was run against. Upstream
      # pushed a new commit on 2026-08-26 whose snapshot symlinks the SAME unpatched
      # blobs; vLLM resolved to it and crash-looped on 'lm_head.weight_scale'. Bump
      # this only together with a re-run of the patch script against the new revision.
      REVISION: "7d6f8d4d72f56b92b3cdbf22f156b90e1bab0108"
      SERVED_NAME: qwen3.8-27b
      # The SEICA agent reads whole manuals into the prompt (~32k tokens/query),
      # so 8192 overflows -> HTTP 400. 40960 fits a full manual read + the answer.
      # KV pool must hold this: at GPU_UTIL 0.93 the KV cache is ~48k tokens.
      MAX_LEN: "40960"
      # 0.93 was TOO HIGH. It handed 4.7GB / 116,480 tokens to the KV cache and left
      # only ~50-250MB free, so ordinary prefill scratch buffers (the NVFP4 GEMM
      # output, the (tokens x 17408) MLP intermediate) failed to allocate mid-request:
      # torch.OutOfMemoryError -> EngineDeadError -> the whole engine dies and the
      # container restarts. 7 restarts in 5 days, 6 clustered in 30 min on 2026-09-01.
      # The tell: every crash logged "GPU KV cache usage: 0.0%" — the KV pool was
      # EMPTY while the GPU was full. 0.90 gives back ~1GB of headroom; KV is still
      # ~92k tokens = 2.2x the 40,960 context, far more than anything uses.
      # 0.86 (was 0.90, 2026-09-09): reserve ~1.3GB more for the DESKTOP, not for vLLM.
      # This card also drives the display, and OBS/NVENC was hard-crashing at record
      # start with only 644MB free. GPU_UTIL is the fraction vLLM may touch, so the
      # remainder is genuinely available to other apps — but only because vLLM starts
      # FIRST and profiles against a free card. KV drops to ~2.65GB / ~65k tokens,
      # still 1.6x the 40,960 context. Do not go below ~0.84: the KV floor for a
      # single 40,960-token request is 1.65GB.
      GPU_UTIL: "0.86"
      # CUDA graphs ON. Eager mode was launch-overhead bound (GPU 27% util, 148W):
      # measured 10.7 -> 61.3 tok/s (~5.7x) single-stream decode, util 27% -> 100%.
      # Safe on this 32GB/62GB-RAM box because MAX_NUM_SEQS=8 keeps the capture set
      # tiny (graph pool ~0.11GiB), so KV stays ~60k tokens (>= SEICA's 40k).
      ENFORCE_EAGER: "0"
      MAX_NUM_SEQS: "8"      # small graph-capture set -> low graph mem -> preserve KV >=40k for SEICA
      LIMIT_MM: '{"image":8,"video":0}'   # was 1 (OCR); raised for the slide-reflection loop which carries several slide screenshots per prompt (max_pixels cap keeps each ~2048 tokens)
      MM_PROCESSOR_KWARGS: '{"max_pixels": 1605632}'  # cap image to ~2048 vision tokens; tames the 50GB encoder profiling
      MAX_NUM_BATCHED_TOKENS: "4096"      # bound the profiling/prefill batch memory
      # The GDN linear-attention kernels JIT-compile on first start. Ninja runs one
      # compiler per core by default; each nvcc/cc1plus needs GBs and OOM'd the box.
      # Cap parallelism so the (one-time, then cached) compile fits in RAM.
      MAX_JOBS: "2"
      FLASHINFER_NVCC_THREADS: "1"
      TOOL_CALL_PARSER: "qwen3_xml"   # enable OpenAI tool/function calling (Qwen3.8 keeps the XML format)
      # NEW IN 3.8. Its chat template no longer splits <think>...</think> back out
      # of an assistant message's `content` on replay — it reads `reasoning_content`
      # only — so the thinking must be parsed out server-side. `content` now holds
      # just the final answer; the chain-of-thought moves to the message's `reasoning`
      # field (vLLM 0.22.1 calls it `reasoning`, NOT `reasoning_content`).
      REASONING_PARSER: "qwen3"
      # ALSO NEW IN 3.8: the template defaults preserve_thinking=true, re-feeding
      # every past <think> block into each prompt. false keeps tool-loop prompts
      # small. Add "reasoning_effort":"medium" (or "low") here if xhigh — the
      # template's default — makes responses too slow.
      DEFAULT_CHAT_TEMPLATE_KWARGS: '{"preserve_thinking": false}'
      # MTP speculative decoding, using the trained mtp weights this checkpoint ships.
      # vLLM SHARES the target model's embedding + lm_head with the draft head
      # ("Detected MTP model. Sharing target model embedding weights..." at startup),
      # so it costs only the one extra decoder layer, NOT the ~5GB an earlier comment
      # here claimed. Measured 2026-09-01: total model load 23.12 GiB incl. MTP.
      # Measured 76-96% draft acceptance. Set to "0" to disable.
      SPEC_DECODE: "1"
      SPEC_NUM_TOKENS: "1"
      # Counter allocator fragmentation — the OOM traces showed 574-665MB "reserved
      # but unallocated", and this is the mitigation torch's own error message names.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      HF_HOME: /root/.cache/huggingface
      # VLLM_API_KEY: "change-me"   # uncomment to require a Bearer token

    volumes:
      # Reuse the model already downloaded on the host (no 23 GB re-download).
      # Override the host path with HF_CACHE_DIR if your cache lives elsewhere.
      - ${HF_CACHE_DIR:-/home/sysadmin/.cache/huggingface}:/root/.cache/huggingface
      # Persist the JIT kernel caches (FlashInfer + torch.compile) on the host so
      # recreates don't re-trigger the slow (~30 min) NVFP4/GDN compile.
      - ${JIT_CACHE_DIR:-/home/sysadmin/.cache/vllm-jit}/flashinfer:/root/.cache/flashinfer
      - ${JIT_CACHE_DIR:-/home/sysadmin/.cache/vllm-jit}/vllm:/root/.cache/vllm

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 600s   # allow time for model load + CUDA-graph capture
